name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        # Discover the suites rather than listing them, so a new tests/test-*.js
        # file cannot be added without CI picking it up.
        run: |
          status=0
          for f in tests/test-*.js; do
            echo "== $f =="
            node "$f" || status=1
          done
          exit $status
      - name: Mutation check
        # A green suite proves the code has not changed, not that it is right. On 2026-08-03 the
        # battery was 23 suites and 778 assertions, all green, and five deliberate bugs walked
        # straight through it — three of them in the damage calculator, which had no test that
        # computed a damage number. This step breaks the app on purpose and fails if the suite
        # that claims to cover each bug stays green.
        run: node build/mutation-check.js
