name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        # Discover the suites rather than listing them, so a new tests/test-*.js
        # file cannot be added without CI picking it up.
        run: |
          status=0
          for f in tests/test-*.js; do
            echo "== $f =="
            node "$f" || status=1
          done
          exit $status
